openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
    /inquiries:
      post:
        operationId: submitInquiry
        tags: [inquiries]
        summary: Send a website enquiry
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        responses:
          "201":
            description: Inquiry sent
          "400":
            description: Invalid inquiry
          "502":
            description: Email provider failure
          "503":
            description: Email delivery is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Inquiry:
      type: object
      required: [kind, name, email, message]
      properties:
        kind:
          type: string
          enum: [contact, franchise]
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        city:
          type: string
        message:
          type: string

