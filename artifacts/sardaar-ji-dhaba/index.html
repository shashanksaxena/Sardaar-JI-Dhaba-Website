<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Sardaar Ji Dhaba | Authentic Indian & Punjabi Food</title>

    <meta
      name="description"
      content="Welcome to Sardaar Ji Dhaba — enjoy authentic Punjabi and Indian food, traditional dhaba-style flavours, delicious meals and a warm dining experience."
    />

    <meta
      name="keywords"
      content="Sardaar Ji Dhaba, Punjabi food, Indian food, dhaba, authentic Punjabi cuisine, North Indian food, Indian restaurant, Punjabi restaurant"
    />

    <meta name="author" content="Sardaar Ji Dhaba" />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <meta name="theme-color" content="#ffffff" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sardaarjidhaba.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sardaarjidhaba.com/" />
    <meta
      property="og:title"
      content="Sardaar Ji Dhaba | Authentic Indian & Punjabi Food"
    />
    <meta
      property="og:description"
      content="Experience authentic Punjabi and Indian food with the traditional warmth and flavours of a classic dhaba."
    />
    <meta
      property="og:image"
      content="https://sardaarjidhaba.com/og-image.jpg"
    />
    <meta property="og:site_name" content="Sardaar Ji Dhaba" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sardaar Ji Dhaba | Authentic Indian & Punjabi Food"
    />
    <meta
      name="twitter:description"
      content="Authentic Punjabi and Indian food served with the warmth and flavours of a traditional dhaba."
    />
    <meta
      name="twitter:image"
      content="https://sardaarjidhaba.com/og-image.jpg"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Restaurant Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Sardaar Ji Dhaba",
        "url": "https://sardaarjidhaba.com/",
        "description": "Sardaar Ji Dhaba serves authentic Punjabi and Indian food with traditional dhaba-style flavours.",
        "servesCuisine": [
          "Indian",
          "Punjabi",
          "North Indian"
        ],
        "priceRange": "$$"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
